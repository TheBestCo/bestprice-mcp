name: Deprecate superseded MCP registry versions

# Manual only. Merging this file does not publish server.json and does not change registry
# status. A dry run prints the plan. Clearing dry run, after that plan looks right, marks each
# named version deprecated. The version the registry marks isLatest is refused.

on:
  workflow_dispatch:
    inputs:
      versions:
        description: >-
          Comma-separated versions to deprecate. Leave empty to select every version the
          registry currently reports as active except the one with isLatest set.
        required: false
        type: string
      dry_run:
        description: >-
          Print the versions that would change and do not update the registry. Turn this
          off only after a dry run looks right.
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: mcp-registry-deprecate
  cancel-in-progress: false

env:
  MCP_PUBLISHER_VERSION: v1.8.1

jobs:
  plan:
    name: Plan registry deprecations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      versions: ${{ steps.plan.outputs.versions }}
      latest: ${{ steps.plan.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Read the registry and print the deprecation plan
        id: plan
        env:
          REQUESTED_VERSIONS: ${{ inputs.versions }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/registry-deprecate-plan.mjs plan

  deprecate:
    name: Deprecate approved versions
    needs: plan
    if: >-
      inputs.dry_run == false &&
      needs.plan.outputs.versions != '' &&
      github.repository == 'TheBestCo/bestprice-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mcp-registry
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Install the official MCP publisher
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Refuse the run unless the approved versions are still not latest
        env:
          APPROVED_VERSIONS: ${{ needs.plan.outputs.versions }}
          APPROVED_LATEST: ${{ needs.plan.outputs.latest }}
        run: node scripts/registry-deprecate-plan.mjs assert

      - name: Authenticate the BestPrice namespace
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$MCP_REGISTRY_PRIVATE_KEY"
          ./mcp-publisher login dns \
            --domain bestprice.gr \
            --private-key "$MCP_REGISTRY_PRIVATE_KEY"

      - name: Deprecate each approved version
        env:
          APPROVED_VERSIONS: ${{ needs.plan.outputs.versions }}
          APPROVED_LATEST: ${{ needs.plan.outputs.latest }}
        run: |
          set -euo pipefail
          message="$(node scripts/registry-deprecate-plan.mjs message)"
          test -n "$message"
          IFS=',' read -r -a versions <<< "${APPROVED_VERSIONS}"
          for version in "${versions[@]}"; do
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Refusing an unexpected version token." >&2
              exit 1
            fi
            if [[ "$version" == "${APPROVED_LATEST}" ]]; then
              echo "Refusing to change the latest version ${version}." >&2
              exit 1
            fi
            decision="$(VERSION="$version" APPROVED_LATEST="$APPROVED_LATEST" node scripts/registry-deprecate-plan.mjs assert-version)"
            if [[ "$decision" == "skip" ]]; then
              echo "Leaving ${version} unchanged because it is already deprecated."
              continue
            fi
            if [[ "$decision" != "deprecate" ]]; then
              echo "Refusing an unexpected decision for ${version}." >&2
              exit 1
            fi
            ./mcp-publisher status \
              --status deprecated \
              --message "$message" \
              gr.bestprice/mcp \
              "$version"
          done
