name: Validate Gemini extension

on:
  push:
    branches: [main]
    paths:
      - gemini-extension.json
      - GEMINI.md
      - skills/**
      - .github/workflows/gemini-extension-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Validate with Gemini CLI 0.61.0
        run: npx --yes @google/gemini-cli@0.61.0 extensions validate .
