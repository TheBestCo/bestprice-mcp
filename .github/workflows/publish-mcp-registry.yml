name: Publish MCP registry metadata

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the connector metadata
        uses: actions/checkout@v7

      - name: Test the connector package
        run: npm test

      - name: Install the official MCP publisher
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Validate server metadata
        run: ./mcp-publisher validate server.json

      - name: Authenticate the BestPrice namespace
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          test -n "$MCP_REGISTRY_PRIVATE_KEY"
          ./mcp-publisher login dns \
            --domain bestprice.gr \
            --private-key "$MCP_REGISTRY_PRIVATE_KEY"

      - name: Publish server metadata
        run: ./mcp-publisher publish server.json
