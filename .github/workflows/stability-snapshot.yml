name: Stability workspace
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/stability-snapshot.yml]
permissions:
  contents: read
concurrency:
  group: mcp-stability-workspace
  cancel-in-progress: false
jobs:
  snapshot:
    if: github.repository == 'TheBestCo/bestprice-mcp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Package public source and dependencies for offline tests
        run: |
          set -euo pipefail
          mkdir -p stability-output
          git rev-parse HEAD > stability-output/source-revision.txt
          git archive --format=tar.gz HEAD > stability-output/source.tar.gz
          git bundle create stability-output/source.bundle main
          tar -czf stability-output/dependencies.tar.gz node_modules
          sha256sum stability-output/source.tar.gz stability-output/source.bundle stability-output/dependencies.tar.gz > stability-output/SHA256SUMS
      - name: Existing repository checks
        run: |
          set -euo pipefail
          npm run check > stability-output/check.log 2>&1
          npm test > stability-output/tests.log 2>&1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: stability-workspace-${{ github.sha }}
          path: stability-output/
          if-no-files-found: error
          retention-days: 2
