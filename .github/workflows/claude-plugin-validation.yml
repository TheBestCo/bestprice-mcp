name: Validate Claude plugin

on:
  push:
    branches: [main]
    paths:
      - .claude-plugin/**
      - .mcp.json
      - skills/**
      - .github/workflows/claude-plugin-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Validate with Claude Code
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate .
