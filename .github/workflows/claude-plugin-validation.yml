name: Validate Claude plugin

on:
  push:
    branches: [main]
    paths:
      - .claude-plugin/**
      - .mcp.json
      - skills/**
      - .github/workflows/claude-plugin-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate with Claude Code
        run: npx --yes @anthropic-ai/claude-code@latest plugin validate .
