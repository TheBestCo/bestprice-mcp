name: Native WebMCP read stability

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/native-read-stability.yml]

permissions:
  contents: read

concurrency:
  group: public-mcp-integrity
  cancel-in-progress: false

jobs:
  native-read:
    if: github.repository == 'TheBestCo/bestprice-mcp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate exact source before browser execution
        run: |
          mkdir -p diagnostic-output
          git rev-parse HEAD > diagnostic-output/source-revision.txt
          git archive --format=tar.gz --output=diagnostic-output/source.tar.gz HEAD
          node --version > diagnostic-output/runtime.txt
          sha256sum scripts/native-read-smoke.mjs package-lock.json diagnostic-output/source.tar.gz > diagnostic-output/source-sha256.txt
          npm ci
          npm run check > diagnostic-output/check.log 2>&1
          npm test > diagnostic-output/tests.log 2>&1
      - name: Install isolated driver and identify existing Chrome
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/native-webmcp-driver"
          npm install --prefix "$deps" --ignore-scripts --no-audit --no-fund --save-exact playwright-core@1.55.0
          test -x /opt/google/chrome/chrome
          echo 'CHROME_BIN=/opt/google/chrome/chrome' >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_MODULE=$deps/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"
          cp "$deps/package-lock.json" diagnostic-output/driver-package-lock.json
      - name: Prove local navigation guards before read-only live tools
        run: timeout --signal=TERM --kill-after=5s 180s xvfb-run -a node scripts/native-read-smoke.mjs --live
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: native-read-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostic-output/
          if-no-files-found: error
          retention-days: 7
