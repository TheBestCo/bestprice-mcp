name: Release

# Tags and releases every package version that reaches main. The GitHub Release body is the
# matching section of CHANGELOG.md, so a missing section fails the release instead of
# shipping empty notes.

on:
  push:
    branches: [main]
    # A release only happens when the version changes, so only run when the files that
    # carry it change. workflow_dispatch covers anything else.
    paths:
      - package.json
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Frozen evidence checks need genuine history in the release path too.
          fetch-depth: 0

      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - id: tag
        name: Check whether the tag exists
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION already exists; nothing to release"
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            status=$?
            # Only exit 2 means no matching ref. Auth/network failures must stop here.
            if [ "$status" -ne 2 ]; then exit "$status"; fi
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.tag.outputs.created == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - if: steps.tag.outputs.created == 'true'
        run: npm ci
      - if: steps.tag.outputs.created == 'true'
        run: npm test
      - if: steps.tag.outputs.created == 'true'
        name: Verify the Node 20 installed package
        run: node scripts/verify-packed-release.mjs "$RUNNER_TEMP/installed-package-node20"

      - if: steps.tag.outputs.created == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.tag.outputs.created == 'true'
        run: npm ci
      - if: steps.tag.outputs.created == 'true'
        run: npm run check
      - if: steps.tag.outputs.created == 'true'
        run: npm test

      - if: steps.tag.outputs.created == 'true'
        name: Verify the Node 22 installed package
        run: node scripts/verify-packed-release.mjs "$RUNNER_TEMP/installed-package-node22"

      - if: steps.tag.outputs.created == 'true'
        name: Extract the changelog section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { keep = 1; next }
            /^## \[/ { keep = 0 }
            keep
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "CHANGELOG.md has no '## [$VERSION]' section" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"

      - if: steps.tag.outputs.created == 'true'
        name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Publish the very tarball checked above, not a newly packed replacement.
          cmp "$RUNNER_TEMP/installed-package-node20/bestprice-mcp-$VERSION.tgz" \
              "$RUNNER_TEMP/installed-package-node22/bestprice-mcp-$VERSION.tgz"
          cp "$RUNNER_TEMP/installed-package-node20/receipt.json" "$RUNNER_TEMP/installed-package-node20.json"
          cp "$RUNNER_TEMP/installed-package-node22/receipt.json" "$RUNNER_TEMP/installed-package-node22.json"
          gh release create "v$VERSION" \
            "$RUNNER_TEMP/installed-package-node22/bestprice-mcp-$VERSION.tgz" \
            "$RUNNER_TEMP/installed-package-node20.json" \
            "$RUNNER_TEMP/installed-package-node22.json" \
            --target "$GITHUB_SHA" \
            --title "BestPrice MCP extension $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.tag.outputs.created == 'true'
        with:
          name: release-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/installed-package-node20/
            ${{ runner.temp }}/installed-package-node22/
          if-no-files-found: warn
          retention-days: 7
