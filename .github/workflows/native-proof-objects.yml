name: Retain qualified native diagnostic objects

on:
  push:
    branches: [main]
    paths: [.github/workflows/native-proof-objects.yml]

permissions:
  contents: read

jobs:
  retain:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: write
    steps:
      - name: Validate the qualified archive before storing immutable source blobs
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, io, json, os, pathlib, urllib.request, zipfile
          root='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def api(path, payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              r=urllib.request.Request(root+path,data=data,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(r,timeout=30) as response: return response.read()
          metadata=json.loads(api('/actions/artifacts/10636311659'))
          assert metadata['workflow_run']['head_sha']=='5f83489e3eeb00fc3da79590764eb5e0a1fc73d9'
          data=api('/actions/artifacts/10636311659/zip')
          assert hashlib.sha256(data).hexdigest()=='61263822f39503b6e29e509794d2a26dbfb54642f373a62b6ce649dc3cfa18a7'
          expected={
            'scripts/native-read-smoke.mjs':('c3c088d788a70ee54017d56e0450da573c811fb9','13a612edc345212adcf363b70831916e1a568959217361285cb34d2438602f10'),
            'scripts/native-read-verdict.js':('83c28fbe14b43ab1a01bf707d63163d704d8d7c5','bdd487514b05146622e4f3d62db5b3bd2d869903bf2d2b608325eb8d80da3953'),
            'test/native-read-verdict.test.js':('f4dc3524d7a87a34cda9290e69e527ec091f8bf7','bb1c8bde1ecca36f3b6d1d9b54aa7bf6c6971971204c6ae5c888020125bd0b2c'),
          }
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              staged={}
              for path,(blob,digest) in expected.items():
                  raw=z.read('candidate/'+path)
                  assert hashlib.sha256(raw).hexdigest()==digest
                  assert hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest()==blob
                  staged[path]=raw
              receipt=[]
              for path,raw in staged.items():
                  response=json.loads(api('/git/blobs',{'encoding':'base64','content':base64.b64encode(raw).decode()}))
                  assert response['sha']==expected[path][0]
                  receipt.append({'path':path,'git_blob':response['sha'],'sha256':expected[path][1]})
          pathlib.Path('qualified-objects.json').write_text(json.dumps(receipt,indent=2))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-qualified-objects-${{ github.run_id }}
          path: qualified-objects.json
          retention-days: 7
