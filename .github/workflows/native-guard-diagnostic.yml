name: Native guard failure diagnosis

on:
  push:
    branches: [main]
    paths: [.github/workflows/native-guard-diagnostic.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - name: Recover exact tests and apply the bounded cleanup correction
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import base64, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          out=Path('diagnostic-output'); out.mkdir(exist_ok=True)
          (out/'source-revision.txt').write_text(os.environ['GITHUB_SHA']+'\n')
          p=Path('scripts/native-read-smoke.mjs'); raw=p.read_bytes()
          assert hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest()=='930bef18149d68b9ffa06d91e29564c0c9bdf6ed'
          (out/'original-native-read-smoke.mjs').write_bytes(raw)
          files={
            'scripts/native-read-verdict.js':'ec02e6d0f244521adbd66474069bb7361a2ed7f9',
            'test/native-read-verdict.test.js':'c0a58f20b3475759352fd516854fa65c4b969220',
          }
          for path,blob in files.items():
              r=urllib.request.Request(f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{blob}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
              with urllib.request.urlopen(r,timeout=30) as response: data=base64.b64decode(json.load(response)['content'])
              assert hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()==blob
              Path(path).write_bytes(data)
          with (out/'original-verdict-tests.tap').open('w') as log:
              result=subprocess.run(['node','--test','--test-reporter=tap','test/native-read-verdict.test.js'],stdout=log,stderr=subprocess.STDOUT,timeout=30)
          text=(out/'original-verdict-tests.tap').read_text()
          assert result.returncode==1 and '# tests 10\n' in text and '# pass 8\n' in text and '# fail 2\n' in text
          s=raw.decode(); first=s.index('import ')
          s=s[:first]+"import { finalizeNativeReadVerdict, recordNativeGuardFailure } from './native-read-verdict.js';\n"+s[first:]
          old="    navigationGuard\n      .send(blocked ? 'Fetch.failRequest' : 'Fetch.continueRequest', {"
          new="""    // Capture provenance before asynchronous completion or a page/control transition.
              const observation = {
                phase,
                denied: Boolean(blocked),
                document: navigation,
                resourceType: event.resourceType,
                control: controlOrigin != null,
              };
              navigationGuard
                .send(blocked ? 'Fetch.failRequest' : 'Fetch.continueRequest', {"""
          assert s.count(old)==1; s=s.replace(old,new)
          old="      .catch(() => {\n        markBlocked('navigation_guard_error');\n      });"
          assert s.count(old)==1; s=s.replace(old,"      .catch(error => recordNativeGuardFailure(report, observation, error));")
          old="  await browser?.close().catch(() => {});\n  report.finishedAt"
          assert s.count(old)==1; s=s.replace(old,"  await browser?.close().catch(() => {});\n  process.exitCode = finalizeNativeReadVerdict(report);\n  report.finishedAt")
          p.write_text(s)
      - name: Require original full gates and repeated cleanup regressions
        run: |
          npm ci
          ./node_modules/.bin/biome check --write scripts/native-read-smoke.mjs scripts/native-read-verdict.js test/native-read-verdict.test.js
          npm run check > diagnostic-output/check.log 2>&1
          npm test > diagnostic-output/tests.log 2>&1
          for concurrency in 1 4 8; do
            node --test --test-reporter=tap --test-concurrency=$concurrency test/native-read-verdict.test.js > diagnostic-output/candidate-verdict-$concurrency.tap
          done
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          out=Path('diagnostic-output'); manifest=[]
          for c in [1,4,8]:
              text=(out/f'candidate-verdict-{c}.tap').read_text()
              counts={k:int(v) for k,v in re.findall(r'^# (tests|pass|fail|cancelled|skipped|todo) (\d+)$',text,re.M)}
              assert counts=={'tests':10,'pass':10,'fail':0,'cancelled':0,'skipped':0,'todo':0},counts
          for path in ['scripts/native-read-smoke.mjs','scripts/native-read-verdict.js','test/native-read-verdict.test.js']:
              p=Path(path); data=p.read_bytes(); target=out/'candidate'/p;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
              manifest.append({'path':path,'git_blob':hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest(),'sha256':hashlib.sha256(data).hexdigest()})
          (out/'candidate-files.json').write_text(json.dumps(manifest,indent=2))
          PY
          git diff -- scripts/native-read-smoke.mjs > diagnostic-output/diagnostic.patch
          sha256sum scripts/native-read-smoke.mjs scripts/native-read-verdict.js scripts/native-read-policy.js scripts/native-read-contracts.js package-lock.json > diagnostic-output/source-sha256.txt
      - name: Use the existing isolated native browser driver
        run: |
          deps="$RUNNER_TEMP/native-webmcp-driver"
          npm install --prefix "$deps" --ignore-scripts --no-audit --no-fund --save-exact playwright-core@1.55.0
          test -x /opt/google/chrome/chrome
          echo 'CHROME_BIN=/opt/google/chrome/chrome' >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_MODULE=$deps/node_modules/playwright-core/index.mjs" >> "$GITHUB_ENV"
      - name: Run unchanged guarded read scenarios with the qualified cleanup verdict
        run: timeout --signal=TERM --kill-after=5s 180s xvfb-run -a node scripts/native-read-smoke.mjs --live
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-guard-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostic-output/
          retention-days: 7
