name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

env:
  MCP_PUBLISHER_VERSION: v1.8.1

# One run per PR (or per ref on main); a newer push cancels the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, tests, packed-release verification and server.json validation used to be four
  # billed jobs (two of them a Node 20/22 matrix). Every job is billed rounded up to a full
  # minute, so they are one job on the .nvmrc Node now. Release still verifies Node 20 and 22
  # on version bumps.
  ci:
    name: Check, test and validate
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The evidence ledger is checked against the merge base, so the job needs the history and the
      # target branch, not just the merge commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate skill frontmatter and manifests
        run: node scripts/validate-manifests.mjs
      - run: npm run check
      - run: npm test
      - name: Verify the isolated installed tarball
        run: node scripts/verify-packed-release.mjs "$RUNNER_TEMP/installed-package"
      - name: Install the official MCP publisher
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
      - run: ./mcp-publisher validate server.json
      # Required step of this job. Exits 1 when healthz or initialize reports a
      # version other than server.json, or when the live tool set differs.
      - name: Smoke-test the live MCP endpoint
        run: node scripts/live-smoke.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: installed-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installed-package/
          if-no-files-found: warn
          retention-days: 3

  # The .nvmrc Node hid a bridge regression that broke every handshake on Node 24-26: from undici
  # 7.12 a discarded fetch body settles two microtasks sooner, and its cancellation beat handshake
  # completion. Runtime timing is per Node line, so the current one runs the tests too; it only
  # tests, since lint, packing and server.json do not depend on the Node version.
  current-node:
    name: Test on the current Node line
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
